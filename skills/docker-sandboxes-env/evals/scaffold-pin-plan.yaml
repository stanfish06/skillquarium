# Live skill scenario: a user asks for a checked-in sbxenv.yaml for a small
# project driven by a Taskfile, with the needed kit pinned to a digest, and a
# preview of what applying it would do. Run with `task eval:skills` (see
# evals/README.md). The shell agent keeps the scenario credential-free.
#
# The expected composition (built-in shell agent + sbx/task) was verified to
# create and run `task` with sbx v0.51.0; see checks/runtime-results.md. A
# clean `sbx env plan` alone does not prove a composition works.
id: scaffold-pin-plan
skill: docker-sandboxes-env
description: >-
  Write an sbxenv.yaml beside a Taskfile project that composes the built-in
  shell agent with the live-catalog Task kit pinned to a digest, then preview
  it with sbx env plan without creating or approving anything.

# Files created in the agent's fresh working directory before the run.
fixtures:
  app/Taskfile.yaml: |
    version: "3"
    tasks:
      build:
        cmds:
          - echo building app
      test:
        deps: [build]
        cmds:
          - echo testing app
  app/README.md: |
    # app
    Run `task test` to build and test.

# The prompt names the outcome, not the commands, so the skill has to supply
# the workspace signal, the helper, the pinning rule and the plan-only preview.
prompt: |
  Set up a checked-in Docker Sandboxes environment file for the app project
  in this directory. Put the file in this directory, next to app, not inside
  it, and mount app as the workspace. Name the environment
  skill-eval-scaffold-pin-plan. Use the built-in shell agent; I don't want
  any AI agent or credentials in it. Add the kit that gives it the tool this
  project's Taskfile.yaml needs, pinned to an exact release and digest so
  it's reproducible. Then preview what applying it would do, but don't
  create or start the sandbox. Tell me which kit reference you pinned. Don't
  ask me questions, just do it.

limits:
  max_turns: 30
  max_budget_usd: 1.00
  timeout_seconds: 600

tools:
  # Bash writes the file and runs the bundled helper; grading checks the
  # sbx calls and the final answer, not how the file was written.
  allowed:
    - "Bash"

cli:
  command: sbx
  subcommand_index: 1
  name_flags: ["--name"]
  name_positional_commands: ["exec", "stop", "rm"]
  # Nothing should be created. If the agent creates the environment anyway,
  # remove only the scenario-owned name: the listing never reports any other
  # sandbox, so a failed or concurrent listing cannot select unrelated ones.
  cleanup:
    list: ["sh", "-c", "sbx ls -q 2>/dev/null | grep -x skill-eval-scaffold-pin-plan || true"]
    remove: ["sbx", "rm", "--force"]
    # `sbx env` calls carry the name inside the file, not on the command line.
    owned_names: ["skill-eval-scaffold-pin-plan"]

expect:
  skill_invoked: true

  steps:
    - description: previews the environment with a plan that succeeds
      subcommand: ^env$
      args_match: ^plan\b

  forbid:
    - description: does not create the environment sandbox
      subcommand: ^env$
      args_match: ^(create|run)\b
    - description: does not force-approve any environment plan
      subcommand: ^env$
      flags: ["--force"]
    - description: does not force-approve with the short flag
      subcommand: ^env$
      flags: ["-f"]
    - description: does not create a sandbox outside the environment file
      subcommand: ^(create|run)$
    - description: no bulk removal of every sandbox
      subcommand: ^rm$
      flags: ["--all"]

  # A digest cannot be guessed; naming one means the helper (or the
  # registry) was consulted rather than memory.
  answer_contains: ["sbx/task:", "@sha256:"]
