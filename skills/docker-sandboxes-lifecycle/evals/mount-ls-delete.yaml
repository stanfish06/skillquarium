# Live skill scenario: a user asks for a sandbox with a host folder mounted,
# wants to see what the sandbox can read there, then wants it torn down and
# the removal verified. Run with `task eval:skills` (see evals/README.md).
id: mount-ls-delete
skill: docker-sandboxes-lifecycle
description: >-
  Create a sandbox with a mounted host directory, list that directory from
  inside the sandbox, read a file, remove the sandbox, and verify it is gone.

# Files created in the agent's fresh working directory before the run.
fixtures:
  notes/hello.txt: "hello from the host\n"
  notes/todo.md: "- write live skill evals\n"

# The simulated user never names the skill or the exact commands.
prompt: |
  I keep some notes in the ./notes folder of this directory. Using Docker
  Sandboxes, spin up a sandbox with just the shell agent (no AI agent inside)
  that has that folder mounted. After creating it, list all sandboxes to
  confirm it exists. Then show me which files the sandbox can see in the
  mounted folder, and also show me the content of hello.txt from inside the
  sandbox. When that's done, tear the sandbox down and double-check it's
  really gone by listing sandboxes again. Don't ask me questions, just do it.

limits:
  max_turns: 30
  max_budget_usd: 1.00
  timeout_seconds: 600

# Tool configuration for this scenario
tools:
  # Additional allowed tools beyond the defaults (Skill, Read, Glob, Grep)
  # We allow Bash broadly to give the agent flexibility in how it composes
  # shell commands (variable assignments, pipes, etc.). The grading checks
  # that the right sbx subcommands were called, not how they were invoked.
  allowed:
    - "Bash"

# CLI tool to track in this scenario
cli:
  # The command prefix to extract from Bash calls
  command: sbx
  # How to parse the command into structured calls
  # (subcommand is first non-flag arg after the command)
  subcommand_index: 1
  # How to extract the target name (e.g., sandbox name) from calls
  name_flags: ["--name"]
  name_positional_commands: ["exec", "stop", "rm", "cp", "ports"]
  # Cleanup: list and remove resources created during the test
  cleanup:
    list: ["sbx", "ls", "-q"]
    remove: ["sbx", "rm", "--force"]

expect:
  # The agent must load this skill through its Skill tool.
  skill_invoked: true

  # Ordered CLI calls the agent must make. Each step matches the first
  # later recorded call satisfying every key. Keys:
  #   subcommand        regex on the CLI subcommand
  #   name              target name the call used ({var} uses a capture)
  #   args_contain      strings that must appear in positional args
  #   args_match        regex on the full argument string
  #   flags             flags that must be present
  #   capture           store the matched call's target name for later steps
  steps:
    - description: creates a sandbox with ./notes as workspace
      subcommand: ^(create|run)$
      args_contain: ["notes"]
      capture: box
    - description: lists sandboxes to confirm creation
      subcommand: ^ls$
    - description: lists the mounted directory from inside the sandbox
      subcommand: ^exec$
      name: "{box}"
      args_match: \b(ls|find|tree)\b
    - description: reads hello.txt content from inside the sandbox
      subcommand: ^exec$
      name: "{box}"
      args_match: \bcat\b.*hello
    - description: removes the sandbox
      subcommand: ^rm$
      name: "{box}"
    - description: verifies the removal by listing sandboxes
      subcommand: ^ls$

  # Calls that must never appear.
  forbid:
    - description: no bulk removal of every sandbox
      subcommand: ^rm$
      flags: ["--all"]
    - description: no pruning, which could remove unrelated stopped sandboxes
      subcommand: ^prune$
    - description: no reset of all sandbox state
      subcommand: ^reset$

  # Text the agent's final answer must contain.
  answer_contains: ["hello.txt", "todo.md", "hello from the host"]
