name: Update skills + rebuild

# Pulls the latest version of every skill from its upstream source using the
# Vercel skills CLI (`npx skills update -g`), then rebuilds the navigation layer
# and commits any changes back.
#
# How CI reconstructs the CLI's global layout
# -------------------------------------------
# The skills CLI installs "global" skills into its canonical dir,
# $HOME/.agents/skills, and records provenance (source repo, path, ref, hash)
# in $HOME/.agents/.skill-lock.json. This repo IS $HOME/.agents: the skill
# folders are the tracked `skills/` subtree and the lock is the tracked
# `.skill-lock.json` at the repo root. CI therefore only has to symlink
# $HOME/.agents to the checkout — no copying a snapshot in and back out — and
# the CLI updates this repo in place.
#
# Source coverage
# ---------------
# `skills update` only auto-updates skills whose lock entry is sourceType
# "github" (installed via owner/repo or an https GitHub URL): it diffs the skill
# folder hash via the GitHub API and reinstalls the ones that changed. Skills
# added from raw "git@github.com:..."/SSH remotes (sourceType "git") or local
# paths are NOT auto-updated by the CLI, so this vault deliberately keeps every
# skill as a github source (see .skill-lock.json). GITHUB_TOKEN is
# used only to raise the API rate limit; all current sources are public.
#
# Embeddings
# ----------
# This workflow never runs `skillquarium embed`: the embedding endpoint lives on
# a private tailnet and is unreachable from GitHub-hosted runners. `validate`
# reports embedding staleness as a warning, never a failure, which is what makes
# a daily skill update safe without re-embedding. Embeddings are refreshed
# locally instead — do not "fix" CI by adding an embed step.

on:
  schedule:
    - cron: "17 6 * * *" # daily at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vault-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install CLI dependencies
        run: bun install --frozen-lockfile --cwd .skill-vault

      - name: Update all global skills from upstream
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: "true"
        run: |
          set -euo pipefail
          # This repo is laid out exactly as $HOME/.agents, so pointing the
          # CLI's home at the checkout gives it both its canonical skills dir
          # ($HOME/.agents/skills -> skills/) and its provenance lock
          # ($HOME/.agents/.skill-lock.json -> .skill-lock.json) for free.
          # The update then rewrites the repo in place.
          rm -rf "$HOME/.agents"
          ln -sfn "$GITHUB_WORKSPACE" "$HOME/.agents"
          test -d "$HOME/.agents/skills" && test -f "$HOME/.agents/.skill-lock.json"

          # Pinned for reproducibility; bump deliberately. `update -g` only
          # touches github-sourced global skills; `-y` makes it non-interactive.
          #
          # The CLI exits 1 if any single skill fails, after having updated all the
          # others. Under `set -e` that aborted the job and discarded 265 good
          # updates for one bad lock entry, freezing the sync from 2026-08-30 (#827).
          # Record the code and carry on; "Fail on partial upstream update" below
          # turns the job red once the sync it did manage has been committed.
          set +e
          npx -y skills@1.5.23 update -g -y
          update_exit=$?
          set -e
          echo "exit_code=$update_exit" >> "$GITHUB_OUTPUT"

      - name: Re-apply local fixes to upstream-managed skills
        # `skills update` reinstalls any skill whose upstream folder changed,
        # which silently reverts merged in-vault fixes (#665). Every such fix is
        # recorded in .skill-vault/data/local-overrides.json; this puts it back.
        # Exits non-zero when an override no longer matches, so a fix that
        # upstream has rewritten gets re-derived instead of vanishing.
        run: ./skillquarium overrides

      - name: Soften coercive skill descriptions
        # Upstream SKILL.md files ship MUST / ALWAYS catalog copy that hijacks
        # matching. Re-apply after each pull; the next rebuild picks it up.
        run: ./skillquarium soften

      - name: Rebuild navigation layer and knowledge graph
        # --prune drops wrapper notes for skills removed upstream (and their
        # personal notes). Safe here because this job is the upstream-sync path.
        run: ./skillquarium build --prune

      - name: Validate knowledge graph
        # Embedding staleness is a warning, not a failure — see the "Embeddings"
        # note in the header. Never add an `embed` step to this workflow.
        run: ./skillquarium validate

      - name: Test
        run: bun test --cwd .skill-vault

      - name: Commit updated skills + index
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "All skills already up to date — nothing to commit."
          else
            git commit -m "chore(skills): update from upstream + rebuild index [skip ci]"
            # Re-sync before pushing in case master advanced since checkout.
            git push || { git pull --rebase origin master && git push; }
          fi

      - name: Report upstream drift
        # This job exits 0 whether or not the CLI pulled anything, which is how
        # four sources sat frozen for months (#786). Compares every lock entry
        # against its upstream folder sha and writes the table to the job
        # summary. Runs after the commit so a red report never blocks the sync;
        # continue-on-error keeps the job green while flagging the step.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./skillquarium drift --fail-on-drift

      - name: Fail on partial upstream update
        # Last, so a partially failed update never blocks the part that succeeded.
        # A lock entry whose local name differs from the upstream `name:` frontmatter
        # can never match the CLI's --skill selector; 66 such entries have never
        # updated once (#827). This keeps that visible instead of silent.
        if: steps.update.outputs.exit_code != '0'
        run: |
          echo "::error::skills update exited ${{ steps.update.outputs.exit_code }}: at least one skill did not update. Everything that did update was committed."
          exit 1
