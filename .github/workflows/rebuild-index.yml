name: Rebuild vault index

# Regenerates the human/Obsidian navigation layer (per-skill wrapper notes,
# domain maps, and index.md) and the knowledge graph from the SKILL.md files
# whenever you push. Runs the skillquarium CLI (Bun + TypeScript, in
# .skill-vault/) via the ./skillquarium wrapper at the repo root. Fast and
# deterministic — it rebuilds, validates, runs the vault tests, then commits
# the result back. It never touches the upstream-managed <skill>/SKILL.md files.

on:
  push:
    branches: [master]
    paths-ignore:
      - ".obsidian/**"      # Obsidian editor state churn shouldn't trigger CI
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: write

# Shared with update-skills.yml so the two workflows never push concurrently.
concurrency:
  group: vault-write
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install CLI dependencies
        run: bun install --frozen-lockfile --cwd .skill-vault

      - name: Rebuild navigation layer and knowledge graph
        run: ./skillquarium build

      - name: Validate knowledge graph
        # Shape violations fail the build; NOT_YET competency questions do not,
        # so an unpopulated Capability layer stays visible without blocking.
        # Embedding staleness is reported as a warning only — never add an
        # `embed` step here, the embedding endpoint is on a private tailnet and
        # is unreachable from GitHub-hosted runners.
        run: ./skillquarium validate

      - name: Test
        run: bun test --cwd .skill-vault

      - name: Commit regenerated files
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Navigation index already up to date — nothing to commit."
          else
            git commit -m "chore(vault): rebuild navigation index [skip ci]"
            git push || { git pull --rebase origin master && git push; }
          fi
